<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Campus ICT10 Q1 Project</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, blue, purple);
      min-height: 100vh;
      font-family: Arial, sans-serif;
    }
    .main-card {
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
      overflow: hidden;
      max-width: 450px;
      margin: 80px auto;
    }
    .page-header {
      background-color: blue;
      color: white;
      padding: 25px;
      text-align: center;
    }
    nav {
      background-color: blue;
      color: white;
      padding: 10px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    nav a {
      color: white;
      text-decoration: none;
      margin-left: 15px;
      cursor: pointer;
    }
    nav a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>
  <nav>
    <span>Skewer</span>
    <div>
      <a onclick="showSection('receipt')">Receipt Generator</a>
      <a onclick="showSection('sku')">SKU Generator</a>
    </div>
  </nav>

  <!-- Receipt Generator Section -->
  <div id="receipt" class="card main-card">
    <div class="page-header">
      <h2>OBMC MENU</h2>
      <p>Receipt Generator</p>
    </div>
    <div class="card-body">
      <h5 class="mb-3">Select Your Items</h5>
      <form>
        <div class="form-check"><input type="checkbox" id="item1" value="99" class="form-check-input"><label class="form-check-label">Americano — ₱99</label></div>
        <div class="form-check"><input type="checkbox" id="item2" value="129" class="form-check-input"><label class="form-check-label">Spanish Latte — ₱129</label></div>
        <div class="form-check"><input type="checkbox" id="item3" value="189" class="form-check-input"><label class="form-check-label">Cold Brew Malt — ₱189</label></div>
        <div class="form-check"><input type="checkbox" id="item4" value="159" class="form-check-input"><label class="form-check-label">Affogato — ₱159</label></div>
        <div class="form-check"><input type="checkbox" id="item5" value="129" class="form-check-input"><label class="form-check-label">Caramel Macchiato — ₱129</label></div>
        <button type="button" onclick="create_order()" class="btn btn-primary mt-3 w-100">Create Order</button>
      </form>
      <div id="show" class="mt-4 text-dark"></div>
    </div>
  </div>

  <!-- SKU Generator Section -->
  <div id="sku" class="card main-card" style="display:none;">
    <div class="page-header">
      <h2>SKU Generator</h2>
    </div>
    <div class="card-body">
      <form>
        <div class="mb-3">
          <label class="form-label">Category</label>
          <select id="category" class="form-select">
            <option>Perishables</option>
            <option>Electronics</option>
            <option>Clothing</option>
            <option>Stationery</option>
            <option>Accessories</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Product Name</label>
          <input type="text" id="product" class="form-control" placeholder="e.g. Bottled Water">
        </div>
        <div class="mb-3">
          <label class="form-label">Stock Quantity</label>
          <input type="number" id="quantity" class="form-control" placeholder="e.g. 50">
        </div>
        <button type="button" onclick="SKU_generator()" class="btn btn-primary w-100">Generate SKU</button>
      </form>
      <div id="sku_output" class="mt-4 text-center text-dark"></div>
    </div>
  </div>

  <script>
    function showSection(section) {
      document.getElementById('receipt').style.display = section === 'receipt' ? 'block' : 'none';
      document.getElementById('sku').style.display = section === 'sku' ? 'block' : 'none';
    }

    function create_order() {
      let items = [
        { id: "item1", name: "Americano", price: 99 },
        { id: "item2", name: "Spanish Latte", price: 129 },
        { id: "item3", name: "Cold Brew Malt", price: 189 },
        { id: "item4", name: "Affogato", price: 159 },
        { id: "item5", name: "Caramel Macchiato", price: 129 }
      ];
      let subtotal = 0, selectedItems = "";
      items.forEach(item => {
        let checkbox = document.getElementById(item.id);
        if (checkbox.checked) {
          subtotal += item.price;
          selectedItems += `<p>${item.name} — ₱${item.price}</p>`;
        }
      });
      let receipt = document.getElementById("show");
      if (subtotal === 0) {
        receipt.innerHTML = '<p class="alert alert-warning">Please select at least one item.</p>';
        return;
      }
      let tax = subtotal * 0.12;
      let total = subtotal + tax;
      receipt.innerHTML = `
        <div class="border rounded p-3 bg-light text-dark">
          <h3>Receipt</h3>
          ${selectedItems}
          <hr>
          <p>Subtotal: ₱${subtotal.toFixed(2)}</p>
          <p>VAT (12%): ₱${tax.toFixed(2)}</p>
          <p><strong>Total: ₱${total.toFixed(2)}</strong></p>
        </div>`;
    }

    function SKU_generator() {
      document.getElementById('sku_output').innerHTML = "";
      let category = document.getElementById('category').value;
      let product_name = document.getElementById('product').value;
      let stock_qty = document.getElementById('quantity').value;
      if (!product_name || !stock_qty) {
        document.getElementById('sku_output').innerHTML = '<p class="alert alert-warning">Please fill out all fields.</p>';
        return;
      }
      let sku = category.slice(0,3).toUpperCase() + "-" +
                product_name.slice(0,4).toUpperCase() + "-" +
                stock_qty;
      document.getElementById('sku_output').innerHTML =
        `<div class="border rounded p-3 bg-light text-dark">
          <h3>Generated SKU</h3>
          <p><strong>${sku}</strong></p>
        </div>`;
    }
  </script>
</body>
</html>
